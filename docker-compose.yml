services:
  # --- Django Web Application ---
  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DJANGO_ENVIRONMENT=local
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # --- PostgreSQL 16 ---
  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lebenslauf_db}
      POSTGRES_USER: ${POSTGRES_USER:-lebenslauf_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdevpassword123}
    # Port 5432 exposed only inside Docker network; use 'docker compose exec db psql' for access
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lebenslauf_user} -d ${POSTGRES_DB:-lebenslauf_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # --- Redis 7 (Cache + Celery Broker) ---
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
