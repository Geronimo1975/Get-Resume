{% if kenntnisse.eintraege %}
<div class="cv-section">
  <h2 class="cv-section-title">{{ section_title|default:"Kenntnisse" }}</h2>
  <div class="cv-divider"></div>
  <div class="cv-skills-grid">
    {% for entry in kenntnisse.eintraege %}
    <div class="cv-skill">
      <div class="cv-skill-header">
        <span>{{ entry.name }}</span>
        {% if entry.kategorie %}<span class="cv-skill-cat">{{ entry.kategorie }}</span>{% endif %}
      </div>
      <div class="cv-skill-bar">
        <div class="cv-skill-fill" style="width: {% widthratio entry.niveau 5 100 %}%"></div>
      </div>
    </div>
    {% endfor %}
  </div>
</div>
{% endif %}
