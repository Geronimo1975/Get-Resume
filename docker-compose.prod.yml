# ==============================================
# Get_Resume Production Stack
# Traefik (external) + Django + Nginx + Redis + Celery
# ==============================================

services:
  # --- Django API (Gunicorn) ---
  resume-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resume-web
    command: >
      gunicorn config.wsgi:application
      --bind 0.0.0.0:8000
      --workers 3
      --timeout 120
      --access-logfile -
      --error-logfile -
    env_file:
      - .env.prod
    environment:
      - DJANGO_ENVIRONMENT=production
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media
    depends_on:
      resume-redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - resume-internal
      - gethub-network
    labels:
      - "traefik.enable=false"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import http.client; c=http.client.HTTPConnection(\"localhost\",8000); c.request(\"GET\",\"/health/\",headers={\"Host\":\"resume.get-hub.io\"}); r=c.getresponse(); exit(0 if r.status==200 else 1)'"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  # --- Nginx (Frontend + Static + Reverse Proxy) ---
  resume-nginx:
    image: nginx:alpine
    container_name: resume-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - static_files:/usr/share/nginx/static:ro
      - media_files:/usr/share/nginx/media:ro
    depends_on:
      resume-web:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - resume-internal
      - gethub-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.resume.rule=Host(`resume.get-hub.io`)"
      - "traefik.http.routers.resume.entrypoints=websecure"
      - "traefik.http.routers.resume.tls=true"
      - "traefik.http.routers.resume.tls.certresolver=letsencrypt"
      - "traefik.http.routers.resume.middlewares=resume-chain"
      # Middlewares
      - "traefik.http.middlewares.resume-chain.chain.middlewares=secure-headers@file,compress@file,rate-limit@file"
      # Service port
      - "traefik.http.services.resume.loadbalancer.server.port=80"
      - "traefik.docker.network=gethub_gethub-network"

  # --- Redis (Cache + Celery Broker) ---
  resume-redis:
    image: redis:7-alpine
    container_name: resume-redis
    env_file:
      - .env.prod
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:-Lb_Redis_2026_xR7kNmP9_secure}
    volumes:
      - resume_redis_data:/data
    restart: unless-stopped
    networks:
      - resume-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Celery Worker ---
  resume-celery:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resume-celery
    command: >
      celery -A config worker
      --loglevel=info
      --concurrency=2
      --max-tasks-per-child=1000
      -Q default,payments,gdpr,emails
    env_file:
      - .env.prod
    environment:
      - DJANGO_ENVIRONMENT=production
    depends_on:
      resume-redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - resume-internal
      - gethub-network

  # --- Celery Beat (Scheduler) ---
  resume-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resume-beat
    command: >
      celery -A config beat
      --loglevel=info
      --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file:
      - .env.prod
    environment:
      - DJANGO_ENVIRONMENT=production
    depends_on:
      resume-redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - resume-internal
      - gethub-network

volumes:
  resume_redis_data:
    driver: local
  static_files:
    driver: local
  media_files:
    driver: local

networks:
  resume-internal:
    driver: bridge
  gethub-network:
    external: true
    name: gethub_gethub-network
